<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียนรับคูปอง</title>

<style>
body{
background:#f3f4f6;
font-family:Segoe UI,sans-serif;
padding:20px;
}

.card{
background:#fff;
max-width:420px;
margin:auto;
padding:20px;
border-radius:20px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.notice{
background:#f3f4f6;
padding:12px;
border-radius:12px;
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
margin-top:12px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:12px;
background:#009846;
color:white;
font-size:18px;
font-weight:bold;
}

.result{
margin-top:12px;
padding:12px;
background:#dcfce7;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div class="card">

<h2>🎁 ลงทะเบียนรับคูปอง</h2>

<div class="notice">
ซื้อสินค้าครบ <b>300 บาทขึ้นไป</b><br>
พร้อมแนบรูปใบเสร็จเพื่อรับสิทธิ์
</div>

<label>ชื่อ-นามสกุล</label>
<input id="name">

<label>เบอร์โทรศัพท์</label>
<input id="phone">

<label>อัปโหลดใบเสร็จ</label>
<input type="file">

<button onclick="submitForm()">
ตรวจสอบสิทธิ์
</button>

<div id="result" class="result">
✅ ส่งข้อมูลสำเร็จ
</div>

</div>

<script>
function submitForm(){

document.getElementById("result")
.style.display="block";

}
</script>

</body>
</html>
