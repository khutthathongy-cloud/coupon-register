<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ลงทะเบียนรับสิทธิ์กระทงคัดสรรฟรี</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.container{
max-width:430px;
margin:auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.notice{
background:#f3f4f6;
padding:15px;
border-radius:12px;
margin-bottom:20px;
line-height:1.7;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
background:#009846;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.loading{
margin-top:15px;
background:#dbeafe;
color:#1e40af;
padding:15px;
border-radius:12px;
}

.success{
margin-top:15px;
background:#dcfce7;
color:#166534;
padding:15px;
border-radius:12px;
line-height:1.8;
}

.error{
margin-top:15px;
background:#fee2e2;
color:#991b1b;
padding:15px;
border-radius:12px;
line-height:1.8;
}

.preview{
margin-top:15px;
width:100%;
border-radius:12px;
display:none;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div style="font-size:30px">🎁</div>
<h2>ลงทะเบียนรับคูปอง</h2>
</div>

<div class="notice">
<strong>ซื้อสินค้าครบ 300 บาทขึ้นไป</strong>
<br>
พร้อมแนบรูปใบเสร็จเพื่อรับสิทธิ์
</div>

<label>ชื่อ-นามสกุล</label>
<input id="name" placeholder="กรอกชื่อ-นามสกุล">

<label>เบอร์โทรศัพท์</label>
<input id="phone" placeholder="08x-xxx-xxxx">

<label>อัปโหลดใบเสร็จ</label>
<input id="receipt" type="file" accept="image/*">

<img id="preview" class="preview">

<button onclick="checkReceipt()">
ตรวจสอบสิทธิ์
</button>

<div id="result"></div>

</div>
<script>

document
.getElementById("receipt")
.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

const preview=
document.getElementById("preview");

preview.src=
URL.createObjectURL(file);

preview.style.display="block";

});

function extractAmount(text){

const lines=text
.split("\n")
.map(line=>line.trim())
.filter(line=>line.length);

for(const line of lines){

const cashPattern=
line.match(/(\d+\.\d{2})\s+0\.00/);

if(cashPattern){

return parseFloat(
cashPattern[1]
);

}
}

const keywords=[
"รวมสุทธิ",
"ยอดสุทธิ",
"ยอดรวม",
"เงินสด",
"total"
];

for(const line of lines){

const lower=
line.toLowerCase();

const found=
keywords.some(word=>
lower.includes(
word.toLowerCase()
)
);

if(found){

const nums=
line.match(
/\d+\.\d{2}/g
);

if(nums){

const values=
nums.map(Number);

return Math.max(...values);

}
}
}

return 0;
}

async function checkReceipt(){

const result=
document.getElementById("result");

const name=
document.getElementById("name")
.value.trim();

const phone=
document.getElementById("phone")
.value.trim();

const file=
document.getElementById("receipt")
.files[0];

if(!name||!phone||!file){

result.innerHTML=`
<div class="error">
❌ กรุณากรอกข้อมูลให้ครบถ้วน
</div>
`;

return;
}

result.innerHTML=`
<div class="loading">
⏳ กำลังอ่านข้อมูลใบเสร็จ...
</div>
`;

try{

const img=
new Image();

img.src=
URL.createObjectURL(file);

img.onload=async()=>{

const canvas=
document.createElement("canvas");

const ctx=
canvas.getContext("2d");

canvas.width=
img.width;

canvas.height=
img.height*0.35;

const cropY=
img.height*0.45;

ctx.filter=
"grayscale(100%) contrast(180%)";

ctx.drawImage(
img,
0,
cropY,
img.width,
img.height*0.35,
0,
0,
canvas.width,
canvas.height
);

const {
 data:{text}
}
=
await Tesseract.recognize(
canvas,
"tha+eng"
);

console.log(text);

const amount=
extractAmount(text);

if(amount>=300){

result.innerHTML=`

<div class="success">

🎉 <b>ยินดีด้วย</b>

<br><br>

คุณได้รับสิทธิ์

<br>

<b>
รับกระทงคัดสรรฟรี
</b>

<br><br>

👤 ${name}

<br>

📞 ${phone}

<br>

💰 ยอดสุทธิ
${amount.toFixed(2)} บาท

</div>

`;

}else{

result.innerHTML=`

<div class="error">

❌ ขออภัย

<br><br>

ยอดซื้อไม่ถึง 300 บาท

<br>

ยอดสุทธิ

${amount.toFixed(2)} บาท

</div>

<div class="debug">

OCR อ่านได้:

${text}

</div>

`;

}

};

}catch(error){

console.error(error);

result.innerHTML=`

<div class="error">

❌ ไม่สามารถอ่านใบเสร็จได้

<br>

กรุณาถ่ายภาพให้ชัดเจน

</div>

`;

}

}

</script>

</body>
</html>
