<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ลงทะเบียนรับสิทธิ์กระทงคัดสรรฟรี</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:430px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.notice{
    background:#f3f4f6;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    line-height:1.7;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#009846;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00853d;
}

.loading{
    margin-top:15px;
    background:#dbeafe;
    color:#1e40af;
    padding:15px;
    border-radius:12px;
}

.success{
    margin-top:15px;
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:12px;
    line-height:1.8;
}

.error{
    margin-top:15px;
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:12px;
    line-height:1.8;
}

.small{
    margin-top:10px;
    font-size:12px;
    opacity:0.8;
}
</style>

</head>
<body>

<div class="container">

    <div class="title">
        <div style="font-size:30px;">🎁</div>
        <h2>ลงทะเบียนรับคูปอง</h2>
    </div>

    <div class="notice">
        <strong>ซื้อสินค้าครบ 300 บาทขึ้นไป</strong><br>
        พร้อมแนบรูปใบเสร็จเพื่อรับสิทธิ์
    </div>

    <label>ชื่อ-นามสกุล</label>
    <input
        type="text"
        id="name"
        placeholder="กรอกชื่อ-นามสกุล">

    <label>เบอร์โทรศัพท์</label>
    <input
        type="tel"
        id="phone"
        placeholder="08x-xxx-xxxx">

    <label>อัปโหลดใบเสร็จ</label>
    <input
        type="file"
        id="receipt"
        accept="image/*">

    <button onclick="checkReceipt()">
        ตรวจสอบสิทธิ์
    </button>

    <div id="result"></div>

</div>

<script>

function extractAmount(text){

    const lines = text.split("\n");

    const keywords = [
        "รวมสุทธิ",
        "ยอดสุทธิ",
        "ยอดรวม",
        "grand total",
        "total"
    ];

    for(const line of lines){

        const lower = line.toLowerCase();

        for(const keyword of keywords){

            if(lower.includes(keyword.toLowerCase())){

                const match =
                    line.match(/(\d+\.\d{2})/);

                if(match){

                    return parseFloat(match[1]);
                }
            }
        }
    }

    const numbers =
        text.match(/[0-9]+(\.[0-9]{2})?/g);

    if(!numbers) return 0;

    const amounts =
        numbers
        .map(Number)
        .filter(n => n < 10000);

    return Math.max(...amounts);
}

async function checkReceipt(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const file =
        document.getElementById("receipt").files[0];

    const result =
        document.getElementById("result");

    if(!name || !phone || !file){

        result.innerHTML = `
        <div class="error">
            ❌ กรุณากรอกข้อมูลและแนบใบเสร็จให้ครบถ้วน
        </div>`;
        return;
    }

    result.innerHTML = `
    <div class="loading">
        ⏳ กำลังตรวจสอบใบเสร็จ...
    </div>`;

    try{

        const {
            data: { text }
        } = await Tesseract.recognize(
            file,
            "tha+eng"
        );

        console.log(text);

        const amount =
            extractAmount(text);

        if(amount >= 300){

            result.innerHTML = `
            <div class="success">

                🎉 <strong>ยินดีด้วย</strong>

                <br><br>

                คุณได้รับสิทธิ์

                <br>

                <strong>
                รับกระทงคัดสรรฟรี
                </strong>

                <br><br>

                👤 ${name}

                <br>

                📞 ${phone}

                <br>

                💰 ยอดซื้อ ${amount.toFixed(2)} บาท

            </div>`;
        }
        else{

            result.innerHTML = `
            <div class="error">

                ❌ ขออภัย

                <br><br>

                ยอดซื้อไม่ถึง 300 บาท

                <br>

                ตรวจพบยอดซื้อ

                <strong>
                ${amount.toFixed(2)} บาท
                </strong>

            </div>`;
        }

    }
    catch(error){

        console.error(error);

        result.innerHTML = `
        <div class="error">

            ❌ ไม่สามารถอ่านใบเสร็จได้

            <div class="small">
            กรุณาถ่ายภาพใบเสร็จให้ชัดและลองใหม่อีกครั้ง
            </div>

        </div>`;
    }
}

</script>

</body>
</html>
