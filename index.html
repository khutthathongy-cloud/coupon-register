<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียนรับคูปอง</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.notice{
    background:#f3f4f6;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    line-height:1.6;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#009846;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.success{
    margin-top:15px;
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:12px;
    line-height:1.8;
}

.error{
    margin-top:15px;
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:12px;
    line-height:1.8;
}

.loading{
    margin-top:15px;
    background:#dbeafe;
    color:#1e40af;
    padding:15px;
    border-radius:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        <div style="font-size:32px">🎁</div>
        <h2>ลงทะเบียนรับคูปอง</h2>
    </div>

    <div class="notice">
        <strong>ซื้อสินค้าครบ 300 บาทขึ้นไป</strong>
        <br>
        พร้อมแนบรูปใบเสร็จเพื่อรับสิทธิ์
    </div>

    <label>ชื่อ-นามสกุล</label>
    <input
        type="text"
        id="name"
        placeholder="กรอกชื่อ-นามสกุล">

    <label>เบอร์โทรศัพท์</label>
    <input
        type="tel"
        id="phone"
        placeholder="08x-xxx-xxxx">

    <label>อัปโหลดใบเสร็จ</label>
    <input
        type="file"
        id="receipt"
        accept="image/*">

    <button onclick="checkBill()">
        ตรวจสอบสิทธิ์
    </button>

    <div id="result"></div>

</div>

<script>

async function checkBill(){

    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const receipt =
      document.getElementById("receipt").files[0];

    const result =
      document.getElementById("result");

    if(!name || !phone || !receipt){

        result.innerHTML = `
        <div class="error">
        ❌ กรุณากรอกข้อมูลและแนบใบเสร็จให้ครบถ้วน
        </div>`;
        return;
    }

    result.innerHTML = `
    <div class="loading">
        ⏳ กำลังอ่านข้อมูลจากใบเสร็จ...
        <br>
        กรุณารอสักครู่
    </div>`;

    try{

        const {
          data: { text }
        } = await Tesseract.recognize(
            receipt,
            'eng'
        );

        console.log(text);

        const matches =
            text.match(/[0-9]+(\.[0-9]{2})?/g);

        if(!matches){

            result.innerHTML = `
            <div class="error">
                ❌ ไม่พบยอดเงินจากใบเสร็จ
            </div>`;
            return;
        }

        const amounts =
            matches.map(Number);

        const amount =
            Math.max(...amounts);

        if(amount >= 300){

            result.innerHTML = `
            <div class="success">

                🎉 <strong>ยินดีด้วย</strong>

                <br><br>

                คุณได้รับสิทธิ์

                <br>

                <strong>
                รับกระทงคัดสรรฟรี 1 ชุด
                </strong>

                <br><br>

                👤 ${name}

                <br>

                📞 ${phone}

                <br>

                💰 ยอดซื้อที่ตรวจพบ :
                <strong>${amount} บาท</strong>

            </div>`;
        }
        else{

            result.innerHTML = `
            <div class="error">

                ❌ ขออภัย

                <br><br>

                ยอดซื้อไม่ถึง 300 บาท

                <br>

                ตรวจพบยอด

                <strong>${amount} บาท</strong>

            </div>`;
        }

    }
    catch(error){

        console.error(error);

        result.innerHTML = `
        <div class="error">

            ❌ ไม่สามารถอ่านข้อมูลจากใบเสร็จได้

            <br><br>

            กรุณาถ่ายรูปให้ชัดเจนและลองใหม่อีกครั้ง

        </div>`;
    }
}

</script>

</body>
</html>
